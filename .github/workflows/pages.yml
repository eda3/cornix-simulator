# static/ の中身を GitHub Pages に出す（docs/design.md の B-53）。
# 途中の step が落ちたら、そこで止まる（テストが落ちたら、ビルドと公開をしない）。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - name: wasm-pack を入れる（公式のリリース。版は固定）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: cargo test --workspace
      - run: wasm-pack build cornix_web --target web --out-dir ../static/pkg --no-typescript
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
